[workspace]
resolver = "2"
members = [
    "crates/fuse-protocol",
    "crates/fuse-server",
    "crates/fuse-client",
    "crates/run-agent",
    "crates/hashd",
    "crates/fuse-mount",
]

[workspace.package]
version = "0.31.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bimap = "0.6"
fuse-protocol = { path = "crates/fuse-protocol" }
servyi-servatui = { git = "https://github.com/servyi/servatui.git", rev = "be753e5", default-features = false }
servatui-display = { git = "https://github.com/servyi/servatui.git", rev = "be753e5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
nix = { version = "0.29", features = ["socket", "uio"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
