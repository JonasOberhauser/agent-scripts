[workspace]
resolver = "2"
members = [
    "crates/fuse-protocol",
    "crates/fuse-server",
    "crates/fuse-client",
    "crates/run-agent",
    "crates/hashd",
    "crates/fuse-mount",
    "crates/netrcd",
]

[workspace.package]
version = "0.27.1"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
# Every unsafe block must carry a // SAFETY: justification (review
# directive, PR #41): restriction-group lint, denied workspace-wide so
# the plain `cargo clippy -- -D warnings` step in CI enforces it with
# no workflow changes; locally the same command catches it early.
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
fuse-protocol = { path = "crates/fuse-protocol" }
fuse-server = { path = "crates/fuse-server" }
fuse-client = { path = "crates/fuse-client" }
run-agent = { path = "crates/run-agent" }
servyi-servatui = { git = "https://github.com/servyi/servatui.git", rev = "be753e5", default-features = false }
servatui-display = { git = "https://github.com/servyi/servatui.git", rev = "be753e5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
