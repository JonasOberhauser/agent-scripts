[workspace]
resolver = "2"
members = [
    "crates/fuse-protocol",
    "crates/fuse-server",
    "crates/fuse-client",
    "crates/run-agent",
    "crates/hashd",
    "crates/fuse-mount",
]

[workspace.package]
version = "0.31.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
# Idiomatic baseline (redundant imports, redundant crates in paths, ...).
rust_2018_idioms = { level = "warn", priority = -1 }
# `unsafe` blocks that contain nothing requiring unsafe (e.g. dereferencing
# a plain `&T` inside `unsafe`). Keeps `unsafe` honest at the other end of
# the spectrum from `unsafe_scope`.
unused_unsafe = "deny"
# Unsafe operations inside `unsafe fn` bodies must still be wrapped in an
# explicit inner `unsafe` block.
unsafe_op_in_unsafe_fn = "deny"
# Unused results and ignored must-use values.
unused_results = "deny"
unused_must_use = "deny"
# Identifiers are ASCII: catches homoglyph look-alikes at zero cost.
non_ascii_idents = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# The whole default clippy group (correctness, suspicious, style,
# complexity, perf). CI runs plain `cargo clippy -- -D warnings` in every
# project, which is this plus default-level rustc lints.
all = "deny"
# At most one unsafe operation (unsafe call, raw deref, ...) per unsafe
# block: `*buf.add(idx)` must be split via let-chaining.
multiple_unsafe_ops_per_block = "deny"
# Every `unsafe` block carries a `// SAFETY:` comment explaining its
# invariants.
undocumented_unsafe_blocks = "deny"
# Panicking via unwrap or bare `panic!` in library code — fail with
# `.expect("why this must succeed")` or a typed error instead. Projects
# exempt tests via `#![cfg_attr(test, allow(...))]` as needed.
unwrap_used = "deny"
panic = "deny"
# Public functions that can panic must document it ("# Panics" section).
missing_panics_doc = "deny"
# Leftover debugging / placeholder markers must not ship.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
bimap = "0.6"
fuse-protocol = { path = "crates/fuse-protocol" }
fuse-server = { path = "crates/fuse-server" }
fuse-client = { path = "crates/fuse-client" }
run-agent = { path = "crates/run-agent" }
servyi-servatui = { git = "https://github.com/servyi/servatui.git", rev = "be753e5", default-features = false }
servatui-display = { git = "https://github.com/servyi/servatui.git", rev = "be753e5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
nix = { version = "0.29", features = ["socket", "uio"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
