[workspace]
resolver = "2"
members = [
    "crates/fuse-protocol",
    "crates/fuse-server",
    "crates/gatekeeper-testkit",
    "crates/fuse-client",
    "crates/run-agent",
    "crates/hashd",
    "crates/fuse-mount",
]

[workspace.package]
version = "0.34.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bimap = "0.6"
fuse-protocol = { path = "crates/fuse-protocol" }
servyi-servatui = { git = "https://github.com/servyi/servatui.git", rev = "a971caf", default-features = false }
servatui-display = { git = "https://github.com/servyi/servatui.git", rev = "a971caf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
nix = { version = "0.29", features = ["socket", "uio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# VENDORED fuser (#103): one added constructor — Session::from_fd_resumed
# (take over an ALREADY-INITIALIZED connection; stock from_fd waits for
# an INIT the kernel sends only once per connection). Delta documented
# in vendor/fuser/README-GATEKEEPER.md; upstreamable.
[patch.crates-io]
fuser = { path = "vendor/fuser" }
