# Basic CI: build everything, run every test tier that works on a
# headless runner, and keep clippy at zero warnings (AGENTS.md contract).
#
# Test tiers:
#   always:  cargo build --all-targets, clippy -D warnings, all unit
#            suites, protocol contract, e2e_client (real client binary
#            against an in-process server — needs a fresh fuse-client
#            build first, the classic cross-crate staleness trap)
#   local:   kernel-FUSE e2e (fuse_e2e) skips itself without /dev/fuse;
#            e2e_empty_os / e2e_stub_fuse intentionally FAIL without
#            podman + /dev/fuse — they guard the no-silent-skips policy
#            and belong on dev machines, not here.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfuse3-dev fuse3
      - name: Build (all targets)
        run: cargo build --workspace --all-targets
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib
      - name: Integration tests (headless tiers)
        run: |
          cargo test -p fuse-protocol
          cargo test -p hashd
          cargo test -p fuse-server --test protocol_contract
          cargo test -p fuse-server --test e2e_client
          cargo test -p fuse-server --test fuse_e2e -- --include-ignored
      - name: Fuzz tiers (deterministic sweeps; marathons stay opt-in)
        # fuzz_orchestrator: 256 seeded worlds, mocked world (~0s).
        # fuzz_daemons: chaos + containment probes; the fuse-mount
        # control-channel chaos runs in the lib tier above.
        run: |
          cargo test -p run-agent --test fuzz_orchestrator
          cargo test -p fuse-server --test fuzz_daemons
      - name: Integration tests (run-agent e2e tier)
        # The orchestrator e2e suites (real rootless podman, per-test
        # tempdir stacks since #59) were previously NEVER run in CI —
        # 14 tests existing on paper only. Runners have podman and
        # registry egress; the suites isolate their own storage/state.
        timeout-minutes: 25
        run: |
          # Rootless podman needs subid ranges; runner images do not
          # configure them for the runner user by default.
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          # crun's sd-bus fix lives IN the harnesses now: each stack
          # writes its own containers.conf (cgroupfs manager) and pins
          # it via CONTAINERS_CONF — the harness overrides
          # XDG_CONFIG_HOME, so a runner-global config never reached
          # the isolated stacks (the first CI attempt failed exactly
          # there).
          podman system migrate || true
          cargo test -p run-agent --test e2e_stub_fuse --test e2e_empty_os -- --include-ignored
