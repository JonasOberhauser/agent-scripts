[package]
name = "fuse-mount"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The gatekeeper DATA daemon: holds the secret bytes and the FUSE mount; every read asks the policy daemon (fuse-server) for access."

[[bin]]
name = "fused"
path = "src/main.rs"

[dependencies]
fuse-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
fuser = { version = "0.15", features = ["abi-7-9"] }
fuse-backend-rs = "0.14"
vm-memory = "0.17"
libc = "0.2"
nix = { workspace = true }
bimap = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { workspace = true }

[dev-dependencies]
servyi-servatui = { workspace = true }
tempfile = "3"
fuse-server = { path = "../fuse-server" }

