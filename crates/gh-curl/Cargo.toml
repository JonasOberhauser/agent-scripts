[package]
name = "gh-curl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gatekeeper-shaped curl for the GitHub API: in-process libcurl, netrc-derived Bearer auth, exact-host allowlist."

[[bin]]
name = "gh-curl"
path = "src/main.rs"

[dependencies]
# static-curl + static-ssl: bundle libcurl and OpenSSL into the binary.
# Deterministic linkage (no system libcurl/libssl) — reproducible builds
# and a stable gatekeeper package hash.
curl = { version = "0.4", features = ["static-curl", "static-ssl"] }
url = "2"
