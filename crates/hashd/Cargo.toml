[package]
name = "hashd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tiny package-hash helper for the fuse gatekeeper: answers 'sha256 of pid N's loaded package' over a unix socket, so the unprivileged fuse-server can hash readers."

[[bin]]
name = "hashd"
path = "src/main.rs"

[dependencies]
procfs = "0.17"
serde_json = { workspace = true }
fuse-protocol = { workspace = true }

[dev-dependencies]
tempfile = "3"

