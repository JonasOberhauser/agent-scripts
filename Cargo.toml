[workspace]
resolver = "2"
members = [
    "crates/fuse-protocol",
    "crates/fuse-server",
    "crates/fuse-client",
    "crates/run-agent",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fuse-protocol = { path = "crates/fuse-protocol" }
fuse-server = { path = "crates/fuse-server" }
fuse-client = { path = "crates/fuse-client" }
run-agent = { path = "crates/run-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
